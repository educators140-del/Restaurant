<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Kolachi Restaurant Karachi</title>
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="portal-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand" style="justify-content:center; margin-bottom:12px;">
          <div class="brand-icon"><i class="fa-solid fa-utensils"></i></div>
        </a>
        <h2>Welcome to Kolachi</h2>
        <p>Sign in to your customer account to place orders & track meals</p>
      </div>

      <div id="auth-alert" style="display:none; background:rgba(239, 68, 68, 0.15); border:1px solid #ef4444; color:#ef4444; padding:10px 14px; border-radius:8px; margin-bottom:20px; font-size:0.88rem;"></div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom:16px;">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" required placeholder="your.name@example.com">
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="signup.html">Create Customer Account</a>
        <br><br>
        <a href="index.html" style="color:var(--text-muted); font-size:0.85rem;"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('auth-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        alertBox.textContent = error.message;
        alertBox.style.display = 'block';
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'portal.html';
        window.location.href = redirect;
      }
    });
  </script>
</body>
</html>
